<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}TaskBoard{% endblock %}</title><link rel="stylesheet" href="/static/board/style.css"></head><body><header><a class="brand" href="/">▦ TaskBoard</a><nav>{% if user.is_authenticated %}<span>Hi, {{ user.username }}</span><form method="post" action="/logout/">{% csrf_token %}<button class="link">Logout</button></form>{% else %}<a href="/login/">Login</a><a href="/register/">Register</a>{% endif %}</nav></header><main>{% if messages %}{% for m in messages %}<p class="notice">{{ m }}</p>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><footer>TaskBoard · A Django project management demo</footer></body></html>
